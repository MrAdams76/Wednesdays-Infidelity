workflows:
  ios-unsigned:
    name: Wednesday Infidelity - Original Source iOS
    instance_type: mac_mini_m4
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios/clean-baseline
          include: true
          source: true
    environment:
      xcode: 16.4
      vars:
        LIME_VERSION: "8.2.2"
        OPENFL_VERSION: "9.4.1"
        FLIXEL_VERSION: "4.11.0"
        FLIXEL_ADDONS_VERSION: "2.11.0"
        FLIXEL_UI_VERSION: "2.4.0"
        HSCRIPT_VERSION: "2.4.0"
        HXCPP_VERSION: "4.3.2"
    scripts:
      - name: Verify original source
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          mkdir -p build-logs
          test -f Project.xml
          test -d source
          test -d assets
          xcodebuild -version
      - name: Install ARM64 Haxe
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          test "$(uname -m)" = "arm64"
          command -v haxe >/dev/null || brew install haxe
          command -v neko >/dev/null || brew install neko
          mkdir -p "$CM_BUILD_DIR/.haxelib-repo"
          haxelib setup "$CM_BUILD_DIR/.haxelib-repo"
          haxe --version
      - name: Install original build dependencies
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          haxelib install lime "$LIME_VERSION" --quiet
          haxelib install openfl "$OPENFL_VERSION" --quiet
          haxelib install flixel "$FLIXEL_VERSION" --quiet
          haxelib install flixel-addons "$FLIXEL_ADDONS_VERSION" --quiet
          haxelib install flixel-ui "$FLIXEL_UI_VERSION" --quiet
          haxelib install hscript "$HSCRIPT_VERSION" --quiet
          haxelib install hxcpp "$HXCPP_VERSION" --quiet
          haxelib install hxp 1.3.0 --quiet
          haxelib install format 3.8.0 --quiet
          haxelib install flxanimate 1.2.0 --quiet
          haxelib set lime "$LIME_VERSION"
          haxelib set openfl "$OPENFL_VERSION"
          haxelib set flixel "$FLIXEL_VERSION"
          haxelib set flixel-addons "$FLIXEL_ADDONS_VERSION"
          haxelib set flixel-ui "$FLIXEL_UI_VERSION"
          haxelib set hscript "$HSCRIPT_VERSION"
          haxelib set hxcpp "$HXCPP_VERSION"
          haxelib set flxanimate 1.2.0
          haxelib set hxp 1.3.0
          haxelib set format 3.8.0
          haxelib list
      - name: Verify reconstruction inputs
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          python3 tools/verify_ios_content.py
          haxe -D touch_actions_test -cp source -cp tools -main TouchActionsTest --interp
          haxe -D touch_actions_test -cp source -cp tools -main TouchRouterTest --interp
          haxe -D touch_actions_test -cp source -cp tools -main AssetPathsTest --interp
          xcrun --sdk iphoneos clang++ -fsyntax-only -x objective-c++ -std=c++11 -arch arm64 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=12.0 native/ios/WIVideo.mm
      - name: Generate iOS Xcode project
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          haxelib run lime update ios -release -verbose 2>&1 | tee build-logs/lime-update.log
          python3 tools/verify_ios_content.py --generated-project
          find export -name '*.xcodeproj' -print
      - name: Compile unsigned iPhone app
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          haxelib run lime build ios -release -nosign -verbose 2>&1 | tee build-logs/lime-build.log
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP="$(find "$CM_BUILD_DIR/export" -type d -name '*.app' -path '*iphoneos*' -print -quit)"
          test -n "$APP" || { echo "No iPhoneOS app found"; exit 1; }
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")
          lipo -archs "$APP/$EXECUTABLE" | grep -qw arm64
          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/ipa/Payload/"
          cd "$CM_BUILD_DIR/ipa"
          zip -qry Wednesday-Infidelity-Unsigned.ipa Payload
    artifacts:
      - ipa/*.ipa
      - build-logs/*.log
